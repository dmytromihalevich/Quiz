{% extends 'quiz/base.html' %}
{% block title %}Приєднатися до вікторини{% endblock %}

{% block content %}
<h2>Приєднатися до вікторини</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Приєднатися</button>
</form>
{% endblock %}
