{% extends 'quiz/base.html' %}
{% block title %}Увійти{% endblock %}

{% block content %}
<h2>Увійти</h2>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <div class="mb-3">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Увійти</button>
</form>
<p class="mt-3">Немає акаунту? <a href="{% url 'quiz:register' %}">Зареєструватися</a></p>
{% endblock %}
