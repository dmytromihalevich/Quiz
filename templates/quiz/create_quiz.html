{% extends 'quiz/base.html' %}
{% block title %}Створити вікторину{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4 text-center">Створення нової вікторини</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-success w-100 mt-3">Створити</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
