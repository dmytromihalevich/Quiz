{% extends 'quiz/base.html' %}

{% block title %}Головна{% endblock %}

{% block content %}
<h2>Доступні вікторини</h2>
<div class="row">
    {% for quiz in quizzes %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ quiz.title }}</h5>
                    <p class="card-text">{{ quiz.description|truncatewords:20 }}</p>
                    <a href="{% url 'quiz:join_quiz' quiz.id %}" class="btn btn-primary">Приєднатися</a>
                </div>
            </div>
        </div>
    {% empty %}
        <p>Поки немає вікторин.</p>
    {% endfor %}
</div>
{% endblock %}
