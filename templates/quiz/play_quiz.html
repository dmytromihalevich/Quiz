{% extends 'quiz/base.html' %}
{% block title %}Грати{% endblock %}

{% block content %}
<h2>{{ member.nickname }}, вікторина: {{ member.quiz_session.quiz.title }}</h2>
<form method="post">
    {% csrf_token %}
    <p>{{ question.text }}</p>
    {% for answer in question.answers.all %}
        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="answer" value="{{ answer.id }}" id="answer{{ answer.id }}">
            <label class="form-check-label" for="answer{{ answer.id }}">{{ answer.text }}</label>
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary mt-2">Далі</button>
</form>
{% endblock %}
