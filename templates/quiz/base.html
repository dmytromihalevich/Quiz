{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz Portal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    

    <link rel="stylesheet" href="{% static 'quiz/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'quiz:home' %}">Quiz Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'quiz:create_quiz' %}">Створити вікторину</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'admin:index' %}">Адмінка</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'quiz:logout' %}">Вийти</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'quiz:login' %}">Увійти</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'quiz:register' %}">Реєстрація</a>
                        </li>
                    {% endif %}
                    <li class="nav-item d-flex align-items-center ms-2">
                        <button id="theme-toggle" class="btn btn-sm theme-toggle-btn" title="Toggle theme">🌙</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function(){
        const toggle = document.getElementById('theme-toggle');
        const root = document.documentElement;
        const key = 'quiz_theme';

        function applyTheme(t){
            if(t === 'dark') root.setAttribute('data-theme','dark');
            else root.removeAttribute('data-theme');
            if(toggle) toggle.textContent = t === 'dark' ? '☀️' : '🌙';
        }

        // init
        const stored = localStorage.getItem(key) || 'light';
        applyTheme(stored);

        if(toggle){
            toggle.addEventListener('click', () => {
                const now = (localStorage.getItem(key) || 'light') === 'dark' ? 'light' : 'dark';
                localStorage.setItem(key, now);
                applyTheme(now);
            });
        }
    })();
    </script>
</body>
</html>
